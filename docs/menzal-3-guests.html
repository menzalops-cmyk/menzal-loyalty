// word timings: weight by letters
const WORDS=[];
for(const [a,b,s] of LINES){
  const ws=s.split(' ');const wt=ws.map(w=>w.replace(/[.،!؟?]/g,'').length+2);
  const tot=wt.reduce((p,q)=>p+q,0);let t=a;
  ws.forEach((w,i)=>{const d=(b-a)*wt[i]/tot;WORDS.push([t,t+d,w.replace(/\.\./g,'').replace(/[،]/g,'')]);t+=d;});
}

// ---------- helpers ----------
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const seg=(t,a,b)=>cl((t-a)/(b-a));
const backOut=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);};
function mix(c1,c2,k){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(c1),B=p(c2);
  return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],k)).toString(16).padStart(2,'0')).join('');}
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r);}
function path(t,keys){ // keys: [[t,x,y],...]
  if(t<=keys[0][0])return [keys[0][1],keys[0][2],0];
  for(let i=0;i<keys.length-1;i++){const [t0,x0,y0]=keys[i],[t1,x1,y1]=keys[i+1];
    if(t<=t1){const k=ease(seg(t,t0,t1));const mov=(x0!==x1||y0!==y1)&&t>t0&&t<t1;return [lerp(x0,x1,k),lerp(y0,y1,k),mov?1:0,x1-x0];}}
  const l=keys[keys.length-1];return [l[1],l[2],0];
}

function night(t){

}
function sunset(t){return seg(t,43.5,45.5)*(1-seg(t,48.4,49.5));}

// cleaning sparkle timelapse
function cleaning(t){
  for(const [a,b] of [[17.8,20.4],[34.9,37.8]]){
    if(t<a||t>b)continue;const k=seg(t,a,b);
    // sweeping broom across rooms
    const route=[[200,FLOOR_UP],[600,FLOOR_UP],[600,FLOOR_DN],[230,FLOOR_DN],[900,FLOOR_DN]];
    const seg_=k*(route.length-1);const i=Math.min(route.length-2,Math.floor(seg_));const f=seg_-i;
    const bx=lerp(route[i][0],route[i+1][0],f),by=lerp(route[i][1],route[i+1][1],f);
    // cleaner
    person(bx,by,'delivery',{t:t*2,walk:1,dir:route[i+1][0]>=route[i][0]?1:-1});
    x.strokeStyle='#8a5a34';x.lineWidth=6;x.beginPath();x.moveTo(bx+20,by-70);x.lineTo(bx+50,by-4);x.stroke();
    // sparkles
    for(let s=0;s<14;s++){const sx=(s*173+Math.floor(t*6)*61)%900+100,sy=(s<7?FLOOR_UP:FLOOR_DN)-((s*97)%260);
      const sk=(Math.sin(t*10+s)+1)/2;star(sx,sy,8+sk*14,sk);}
    // timelapse pill
    pill(540,700,'⏱ تنظيف كامل',BRAND,'#fff',1);
  }
}

function pill(X,Y,txt,bg,fg,k,size=40){
  if(k<=0)return;x.save();x.translate(X,Y);x.scale(backOut(cl(k)),backOut(cl(k)));
  x.font=`900 ${size}px Cairo`;x.textAlign='center';x.textBaseline='middle';x.direction='rtl';
  const w=x.measureText(txt).width+56;x.fillStyle=bg;rr(-w/2,-size*0.85,w,size*1.7,size*0.85);x.fill();
  x.fillStyle=fg;x.fillText(txt,0,4);x.restore();}

// ---------- characters timeline ----------
const DOOR=[1060,FLOOR_DN];
function charsFamily(t){
  if(t<3.5||t>19.4)return;
  const leave=17.6;
  const P={
    dad:[[3.6,1060,FLOOR_DN],[5.2,700,FLOOR_DN],[13.6,700,FLOOR_DN],[14.4,800,FLOOR_DN],[15.2,650,FLOOR_UP],[15.6,250,FLOOR_UP],[17.6,250,FLOOR_UP],[18.2,650,FLOOR_UP],[18.6,800,FLOOR_DN],[19.4,1080,FLOOR_DN]],
    mom:[[3.9,1060,FLOOR_DN],[5.6,760,FLOOR_DN],[7.8,760,FLOOR_DN],[9.4,240,FLOOR_DN],[13.4,240,FLOOR_DN],[14.4,800,FLOOR_DN],[15.2,650,FLOOR_UP],[15.7,300,FLOOR_UP],[17.6,300,FLOOR_UP],[18.2,650,FLOOR_UP],[18.6,800,FLOOR_DN],[19.4,1080,FLOOR_DN]],
    kid1:[[4.2,1060,FLOOR_DN],[5.8,620,FLOOR_DN],[11.6,620,FLOOR_DN],[12.2,470,FLOOR_DN],[13.8,470,FLOOR_DN],[14.6,800,FLOOR_DN],[15.3,650,FLOOR_UP],[15.8,350,FLOOR_UP],[17.6,350,FLOOR_UP],[18.2,650,FLOOR_UP],[18.6,800,FLOOR_DN],[19.4,1080,FLOOR_DN]],
    kid2:[[4.4,1060,FLOOR_DN],[6.0,560,FLOOR_DN],[11.6,560,FLOOR_DN],[12.2,420,FLOOR_DN],[13.8,420,FLOOR_DN],[14.7,800,FLOOR_DN],[15.4,650,FLOOR_UP],[15.9,390,FLOOR_UP],[17.6,390,FLOOR_UP],[18.2,650,FLOOR_UP],[18.6,800,FLOOR_DN],[19.4,1080,FLOOR_DN]],
  };
  const sleeping=t>15.9&&t<17.6;
  for(const k of ['dad','mom','kid1','kid2']){
    let [px,py,mv,dx]=path(t,P[k]);
    if(sleeping){const sx={dad:200,mom:260,kid1:320,kid2:370}[k];person(sx,FLOOR_UP-78,k,{t,sleep:1});continue;}
    person(px,py,k,{t,walk:mv,dir:mv?(dx>=0?1:-1):(k==='mom'&&t>9.4&&t<13.4?-1:1)});
  }
  if(sleeping){ // blanket
    x.fillStyle='#f5d0a9';rr(180,FLOOR_UP-98,220,30,12);x.fill();}
}
function charsGuys(t){
  if(t<20.6||t>35.6)return;
  const names=['guyA','guyB','guyC','guyD'];
  names.forEach((k,i)=>{
    const st=20.7+i*0.3;
    const keys=[[st,1060,FLOOR_DN],[st+1.4,880-i*14,FLOOR_DN],[25.8+i*.1,880-i*14,FLOOR_DN],[26.8+i*.1,440+i*60,FLOOR_DN],[31.8,440+i*60,FLOOR_DN],[35,440+i*60,FLOOR_DN],[35.6,1080,FLOOR_DN]];
    if(t>31.9&&t<34.9){ // sleeping on sofa / floor
      const spots=[[450,FLOOR_DN-80],[560,FLOOR_DN-80],[720,FLOOR_DN],[330,FLOOR_DN]];
      person(spots[i][0],spots[i][1],k,{t:t+i,sleep:1});return;}
    const [px,py,mv,dx]=path(t,keys);
    const sitting=t>26.9&&t<31.9;
    person(px,sitting?FLOOR_DN-50:py,k,{t:t+i*.3,walk:mv,sit:sitting,dir:mv?(dx>=0?1:-1):-1});
    if(sitting){x.fillStyle='#222';x.fillRect(px-18,FLOOR_DN-118,22,10);} // controller
  });
  // wifi zoom popup
  const wk=seg(t,22.8,23.3)*(1-seg(t,25.4,25.8));
  if(wk>0){x.save();x.translate(760,1000);x.scale(backOut(wk),backOut(wk));x.fillStyle='#fff';x.strokeStyle=BRAND;x.lineWidth=8;rr(-210,-120,420,240,28);x.fill();x.stroke();
    x.direction='ltr';x.textAlign='center';x.fillStyle=BRAND;x.font='900 54px Cairo';x.fillText('WiFi 📶',0,-40);
    x.fillStyle='#333';x.font='700 38px Cairo';x.fillText('Menzal_Guest',0,20);x.fillText('••••••••',0,72);x.restore();}
  // delivery
  if(t>29&&t<31.6){const [px,py,mv,dx]=path(t,[[29.1,1080,FLOOR_DN],[29.9,900,FLOOR_DN],[30.8,900,FLOOR_DN],[31.6,1080,FLOOR_DN]]);
    person(px,py,'delivery',{t,walk:mv,dir:mv?(dx>=0?1:-1):-1});pill(760,1000,'🕒 3:00 الفجر','#222','#ffd43b',seg(t,29.2,29.6));}
}
function charsChill(t){
  if(t<38||t>52)return;
  const keys=[[38.1,1060,FLOOR_DN],[39.4,800,FLOOR_DN],[40.1,650,FLOOR_UP],[40.8,520,FLOOR_UP],[44.0,520,FLOOR_UP],[44.8,860,FLOOR_UP]];
  if(t>41.2&&t<44.0){person(560,FLOOR_UP-78,'chill',{t,sleep:1});
    // clock pill
    const hrs=Math.floor(lerp(12,16,seg(t,41.2,43.8)));pill(540,700,`🕒 ${hrs>12?hrs-12:hrs}:00 ${hrs<13?'الظهر':'العصر'}`,'#222','#fff',seg(t,41.3,41.7));
    return;}
  const [px,py,mv,dx]=path(t,keys);
  if(t>44.8){person(905,FLOOR_UP-52,'chill',{t,sit:1});
    // coffee + steam
    x.fillStyle='#fff';rr(940,FLOOR_UP-118,22,26,4);x.fill();x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=4;
    for(let i=0;i<2;i++){x.beginPath();const o=Math.sin(t*3+i)*6;x.moveTo(946+i*10,FLOOR_UP-124);x.quadraticCurveTo(940+i*10+o,FLOOR_UP-150,950+i*10,FLOOR_UP-176);x.stroke();}
    // extension bubble
    const k=seg(t,46.2,46.7);if(k>0){x.save();x.translate(760,700);x.scale(backOut(k),backOut(k));x.fillStyle='#fff';rr(-250,-70,500,140,30);x.fill();
      x.fillStyle='#1a9e55';x.font='900 46px Cairo';x.textAlign='center';x.textBaseline='middle';x.direction='rtl';x.fillText('✅ تمديد الإقامة +١ يوم',0,4);x.restore();}
    return;}
  person(px,py,'chill',{t,walk:mv,dir:mv?(dx>=0?1:-1):1});
  if(mv&&t<40.2){x.fillStyle='#8a5a34';rr(px+14,py-60,26,30,5);x.fill();}
}

// ---------- overlays ----------
function header(t){
  let g=0;if(t>=3.4)g=1;if(t>=20.6)g=2;if(t>=38)g=3;
  x.save();x.font='900 44px Cairo';x.textAlign='center';x.textBaseline='middle';x.direction='rtl';
  x.fillStyle='rgba(0,0,0,.55)';rr(300,70,480,84,42);x.fill();
  x.fillStyle='#fff';x.fillText('شقة وحدة • ٣ ضيوف',540,113);
  // guest dots
  for(let i=0;i<3;i++){const on=g>i;x.fillStyle=on?GOLD:'rgba(255,255,255,.4)';x.beginPath();x.arc(500+ (2-i)*40,200,13,0,7);x.fill();}
  x.restore();
  // guest tag
  const tags=[[3.4,'الضيف ١: العائلة 👨‍👩‍👧'],[20.6,'الضيف ٢: الشباب 🎮'],[38,'الضيف ٣: المرتاح ☕']];
  for(const [a,s] of tags){const k=seg(t,a,a+.4)*(1-seg(t,a+2.6,a+3));pill(540,290,s,GOLD,'#fff',k,46);}
  // info pills
  const infos=[[6.2,8.6,'٥ شناط ← ليلتين 😅'],[15.9,17.5,'الغرفة الثانية: فاضية 🙃'],[32.2,34.6,'الأسرّة: محد لمسها 🛏️']];
  for(const [a,b,s] of infos){pill(540,700,s,'#fff',BRAND,seg(t,a,a+.3)*(1-seg(t,b-.3,b)),42);}
}
function caption(t){
  const w=WORDS.find(w=>t>=w[0]&&t<w[1]);if(!w)return;
  const k=seg(t,w[0],w[0]+.12);
  x.save();x.translate(540,520);const s=.85+.15*backOut(k);x.scale(s,s);
  x.font='900 112px Cairo';x.textAlign='center';x.textBaseline='middle';x.direction='rtl';
  x.lineJoin='round';x.lineWidth=22;x.strokeStyle='#000';x.strokeText(w[2],0,0);x.fillStyle='#fff';x.fillText(w[2],0,0);x.restore();
}

// "which type are you" split
function typesScene(t){
  const k=seg(t,48.4,49.0);if(k<=0)return;
  x.fillStyle=`rgba(20,12,16,${.78*k})`;x.fillRect(0,0,W,H);
  const cards=[['العائلة','👨‍👩‍👧',['dad','mom','kid1']],['الشباب','🎮',['guyA','guyB','guyD']],['المرتاح','☕',['chill']]];
  cards.forEach(([name,emo,ppl],i)=>{
    const kk=backOut(seg(t,48.6+i*.35,49.1+i*.35));if(kk<=0)return;
    const cx=540,cy=820+i*330;x.save();x.translate(cx,cy);x.scale(kk,kk);
    x.fillStyle='#fff8ee';rr(-420,-140,840,280,36);x.fill();x.strokeStyle=GOLD;x.lineWidth=6;x.stroke();
    ppl.forEach((p,j)=>person(-300+j*80,90,p,{t:t+j,walk:0}));
    x.font='900 76px Cairo';x.textAlign='right';x.textBaseline='middle';x.direction='rtl';x.fillStyle=BRAND;x.fillText(name,380,-10);
    x.font='72px "Noto Color Emoji"';x.textAlign='left';x.fillText(emo,-60,-10);x.restore();
  });
}
function endCard(t){
  const k=seg(t,52,52.6);if(k<=0)return;
  x.save();x.globalAlpha=k;const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#fff7ec');g.addColorStop(1,'#f3e2c8');x.fillStyle=g;x.fillRect(0,0,W,H);
  const img=document.getElementById('logo');const lk=backOut(seg(t,52.2,52.9));
  x.translate(540,760);x.scale(lk,lk);x.drawImage(img,-340,-340*img.height/img.width,680,680*img.height/img.width);x.restore();
  x.save();x.globalAlpha=k;x.textAlign='center';x.textBaseline='middle';x.direction='rtl';
  const k2=seg(t,53.4,53.9);x.globalAlpha=k2;x.fillStyle='#3a2a2a';x.font='900 70px Cairo';x.fillText('أي نوع كنت..',540,1140);
  x.fillStyle=BRAND;x.font='900 92px Cairo';x.fillText('مكانك جاهز',540,1250);
  const k3=backOut(seg(t,54.6,55.1));x.translate(540,1440);x.scale(k3,k3);x.fillStyle=BRAND;rr(-230,-62,460,124,62);x.fill();
  x.fillStyle='#fff';x.font='900 58px Cairo';x.fillText('احجز الحين',0,6);x.restore();
}

function render(t){
  x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.direction='ltr';
  drawSky(t);drawBuilding(t);drawScene(t);
  charsFamily(t);charsGuys(t);charsChill(t);cleaning(t);
  // night dim on interior already; vignette
  header(t);
  typesScene(t);endCard(t);
  if(t<52) caption(t);
}
window.render=render;window.DUR=DUR;
window.ready=Promise.all([document.fonts.load('900 40px Cairo'),document.fonts.load('700 40px Cairo'),new Promise(r=>{const i=document.getElementById('logo');i.complete?r():i.onload=r;})]);

// ---------- player ----------
let start=null,raf=null;
function loop(now){if(start===null)start=now;const t=(now-start)/1000;render(Math.min(t,DUR));if(t<DUR)raf=requestAnimationFrame(loop);else{start=null;onEnd&&onEnd();}}
let onEnd=null;
function play(){cancelAnimationFrame(raf);start=null;raf=requestAnimationFrame(loop);}
window.ready.then(()=>render(0));
document.getElementById('play').onclick=()=>{onEnd=null;play();};
document.getElementById('rec').onclick=()=>{
  const stream=c.captureStream(30);
  const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8e6});const chunks=[];
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mime}));a.download='menzal-3-guests.'+(mime.includes('mp4')?'mp4':'webm');a.click();};
  onEnd=()=>rec.stop();rec.start();play();
};
